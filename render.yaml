# QUÉ ES: la receta para publicar la API en Render (un "Blueprint").
# NIVEL: despliegue — Render lo lee al crear el servicio desde el repo.
# DÓNDE SE USA: Render → New → Blueprint → elegir este repo.
#
# La base no está acá: es PostgreSQL en Neon. Su URL se carga a mano en Render
# (sync: false), así la contraseña nunca queda en el repo.

services:
  - type: web
    name: sigedem-backend
    runtime: node
    plan: free
    # Misma zona que la base de Neon (AWS US East 2, Ohio): si la API y la
    # base están cerca, cada consulta tarda menos. No se puede cambiar después.
    region: ohio
    branch: main
    # npm ci instala lo de package-lock.json (también las devDependencies, como
    # el CLI de prisma y el de Nest) y, al terminar, el postinstall corre
    # "prisma generate". migrate deploy aplica en Neon las migraciones que
    # falten (si no falta ninguna, no hace nada). Después se compila con Nest.
    # Si una migración falla, el deploy se corta y sigue la versión anterior.
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    # Render llama a esta ruta para saber si la API arrancó bien.
    healthCheckPath: /api
    envVars:
      # PORT no va: Render lo pone solo y env.ts lo lee.
      - key: DATABASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
